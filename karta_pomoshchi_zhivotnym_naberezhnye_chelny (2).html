L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{maxZoom:19,attribution:'&copy; OpenStreetMap contributors'}).addTo(map);
let markers=[];
function color(t){
 if(t.includes('Приют'))return '#d33';
 if(t.includes('Передержка'))return '#e39b18';
 if(t.includes('Выезд'))return '#7b4ab5';
 if(t.includes('Волонт'))return '#d34c8b';
 if(t.includes('Благотвор'))return '#b06a22';
 return '#3388ff';
}
function addPlace(p){
 const m=L.circleMarker([p.lat,p.lon],{radius:8,color:color(p.type),fillColor:color(p.type),fillOpacity:.88,weight:2});
 m.place=p;
 const route='https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(p.address);
 m.bindPopup('<div class="popup"><h3>'+p.name+'</h3><p><b>'+p.type+'</b></p><p>'+p.address+'</p>'+(p.phone?'<p>📞 '+p.phone+'</p>':'')+'<p>'+p.note+'</p><a target="_blank" href="'+route+'">Открыть маршрут</a></div>');
 m.addTo(map);
 markers.push(m);
}
function filterType(type,btn){
 document.querySelectorAll('button').forEach(b=>b.classList.remove('active'));
 btn.classList.add('active');
 markers.forEach(m=>{
  const show=type==='Все'||m.place.type===type;
  if(show)m.addTo(map);else map.removeLayer(m);
 });
}
